[project]
name = "mcp-scan"
version = "0.1.0"
description = "Security scanner for Model Context Protocol servers: tool poisoning, rug pull, shadowing, excessive permissions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fr2endly" }]
keywords = ["mcp", "security", "ai", "agents", "prompt-injection", "llm", "tool-poisoning"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/fr2endly/mcp-scan"
Issues = "https://github.com/fr2endly/mcp-scan/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
